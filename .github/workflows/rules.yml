name: Validate, publish and sync configuration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 11:17 Asia/Shanghai daily. GitHub may delay scheduled jobs.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: dailyroute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/build_variants.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate.py

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate APNs proxy profile and validation report
        run: |
          python3 scripts/build_variants.py
          python3 scripts/validate.py --write-report
      - name: Fetch and validate official Telegram CIDRs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/sync_telegram.py
      - name: Publish generated files
        shell: bash
        run: |
          if git diff --quiet -- DailyRoute-APNs-Proxy.conf rules/telegram.list notification-sources.json original-plus-validation.json; then
            echo "Published files are up to date"
            exit 0
          fi
          remote_head="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "A newer commit will publish its own generated files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DailyRoute-APNs-Proxy.conf rules/telegram.list notification-sources.json original-plus-validation.json
          git commit -m "Publish generated DailyRoute configuration and rules"
          git push origin HEAD:main
