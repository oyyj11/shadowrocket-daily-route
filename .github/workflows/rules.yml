name: Validate and sync shared rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 11:17 Asia/Shanghai daily. GitHub may delay scheduled jobs.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: dailyroute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate.py

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch and validate official Telegram CIDRs
        run: python3 scripts/sync_telegram.py
      - name: Commit validated rule changes only
        shell: bash
        run: |
          if git diff --quiet -- rules/telegram.list notification-sources.json original-plus-validation.json; then
            echo "No published data changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/telegram.list notification-sources.json original-plus-validation.json
          git commit -m "Sync official Telegram address ranges"
          git push origin HEAD:main
